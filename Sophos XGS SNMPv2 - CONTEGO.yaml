          value: '^(lo|sit|ipsec|ppp|gre|tun|tap|docker|veth|br|bond|vlan.*)$'
        -
          macro: '{$MEMORY_UTIL_MAX}'
          value: '90'
        -
          macro: '{$SFOS_F_MIB_CONN_ACTIVE}'
          value: '.*'
        -
          macro: '{$SFOS_F_MIB_CONN_ACTIVE_NOT}'
          value: ^$
        -
          macro: '{$SFOS_F_MIB_CONN_DESC}'
