      discovery_rules:
        -
          uuid: 4873cc2f130a4907804dca4f70c62d7c
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2]'
          key: net.if.discovery.sophos
          delay: 10m
          filter:
            conditions:
              -
                macro: '{#IFNAME}'
                value: '{$IFNAME_MATCHES}'
                formulaid: A
              -
                macro: '{#IFNAME}'
                value: '{$IFNAME_NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            -
              uuid: 93b8458611574a1b95309eab0c968231
              name: 'Interface {#IFNAME}: Admin status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.adminstatus.sophos[{#SNMPINDEX}]'
              history: 2w
              trends: 120d
              valuemap:
                name: 'Interface operational status'
              tags:
                -
                  tag: Application
                  value: Interfaces
            -
              uuid: b516264502f44352b046199e6c4ca8df
              name: 'Interface {#IFNAME}: Incoming traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in.sophos[{#SNMPINDEX}]'
              history: 2w
              trends: 120d
              value_type: FLOAT
              units: bps
              preprocessing:
                -
                  type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                -
                  type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                -
                  tag: Application
                  value: Interfaces
            -
              uuid: d75fb76d06f142a7b41306f8257c5f48
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.operstatus.sophos[{#SNMPINDEX}]'
              history: 2w
              trends: 120d
              valuemap:
                name: 'Interface operational status'
              tags:
                -
                  tag: Application
                  value: Interfaces
            -
              uuid: b3aa88c4a83849d3a47846a964f2d4c0
              name: 'Interface {#IFNAME}: Outgoing traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out.sophos[{#SNMPINDEX}]'
              history: 2w
              trends: 120d
              value_type: FLOAT
              units: bps
              preprocessing:
                -
                  type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                -
                  type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                -
                  tag: Application
                  value: Interfaces
          trigger_prototypes:
            -
              uuid: e4c7f07b2639408e8c76d33706496cb4
              expression: 'last(/Sophos XGS SNMPv2 - CONTEGO/net.if.adminstatus.sophos[{#SNMPINDEX}])=1 and last(/Sophos XGS SNMPv2 - CONTEGO/net.if.operstatus.sophos[{#SNMPINDEX}])<>1'
              name: 'Interface {#IFNAME}: Link is down'
              priority: AVERAGE
          graph_prototypes:
            -
              uuid: 4bb6ba570b364f418fe7dfbfccd0af89
              name: 'Interface {#IFNAME}: Traffic'
              graph_items:
                -
                  sortorder: '1'
                  color: 199C0D
                  item:
                    host: 'Sophos XGS SNMPv2 - CONTEGO'
                    key: 'net.if.in.sophos[{#SNMPINDEX}]'
                -
                  sortorder: '2'
                  color: F63100
                  item:
                    host: 'Sophos XGS SNMPv2 - CONTEGO'
                    key: 'net.if.out.sophos[{#SNMPINDEX}]'
        -
          uuid: 4245f7bd9f0a4c7897a3f40a4adee226
          name: 'Vpn Interface Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SFOS_CONN_NAME},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.2,{#SFOS_CONN_DESC},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.3,{#SFOS_CONN_TYPE},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.6,{#SFOS_VPN_LOCAL_PORT},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.7,{#SFOS_VPN_CONN_STATUS},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9,{#SFOS_VPN_CONN_ACTIVE},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.10]'
          key: net.if.status
          filter:
            conditions:
              -
                macro: '{#SFOS_CONN_DESC}'
                value: '{$SFOS_F_MIB_CONN_DESC_NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              -
                macro: '{#SFOS_CONN_DESC}'
                value: '{$SFOS_F_MIB_CONN_DESC}'
                formulaid: B
              -
                macro: '{#SFOS_CONN_NAME}'
                value: '{$SFOS_F_MIB_CONN_NAME_NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
              -
                macro: '{#SFOS_CONN_NAME}'
                value: '{$SFOS_F_MIB_CONN_NAME}'
                formulaid: D
              -
                macro: '{#SFOS_CONN_TYPE}'
                value: '{$SFOS_F_MIB_CONN_DESC_NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: E
              -
                macro: '{#SFOS_CONN_TYPE}'
                value: '{$SFOS_F_MIB_CONN_DESC}'
                formulaid: F
              -
                macro: '{#SFOS_VPN_CONN_ACTIVE}'
                value: '{$SFOS_F_MIB_CONN_ACTIVE_NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: G
              -
                macro: '{#SFOS_VPN_CONN_ACTIVE}'
                value: '{$SFOS_F_MIB_CONN_ACTIVE}'
                formulaid: H
              -
                macro: '{#SFOS_VPN_CONN_STATUS}'
                value: '{$SFOS_F_MIB_CONN_STATUS_NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: I
              -
                macro: '{#SFOS_VPN_CONN_STATUS}'
                value: '{$SFOS_F_MIB_CONN_STATUS}'
                formulaid: J
              -
                macro: '{#SFOS_VPN_LOCAL_PORT}'
                value: '{$SFOS_F_MIB_LOCAL_PORT_NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: K
              -
                macro: '{#SFOS_VPN_LOCAL_PORT}'
                value: '{$SFOS_F_MIB_LOCAL_PORT}'
                formulaid: L
          item_prototypes:
            -
              uuid: e0b867c30edf436087afa8e241601579
              name: 'IPSec {#SFOS_CONN_NAME}: Active'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.status[IPSecActive.{#SNMPINDEX}]'
              tags:
                -
                  tag: Application
                  value: 'IPSec {#SFOS_CONN_NAME}'
              trigger_prototypes:
                -
                  uuid: 36acf42d298748ba8b31282e61b84ded
                  expression: 'last(/Sophos XGS SNMPv2 - CONTEGO/net.if.status[IPSecActive.{#SNMPINDEX}],#1) <> last(/Sophos XGS SNMPv2 - CONTEGO/net.if.status[IPSecActive.{#SNMPINDEX}],#2) and last(/Sophos XGS SNMPv2 - CONTEGO/net.if.status[IPSecActive.{#SNMPINDEX}]) = 0'
                  name: 'IPSec {#SFOS_CONN_NAME}: Desabilitada'
                  priority: HIGH
            -
              uuid: cbae1633de38432ea5075ce51a900267
              name: 'IPSec {#SFOS_CONN_NAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9.{#SNMPINDEX}'
              key: 'net.if.status[IPSecStatus.{#SNMPINDEX}]'
              tags:
                -
                  tag: Application
                  value: 'IPSec {#SFOS_CONN_NAME}'
          trigger_prototypes:
            -
              uuid: f3212fe95cee4a139b6554981a7d78c1
              expression: 'last(/Sophos XGS SNMPv2 - CONTEGO/net.if.status[IPSecStatus.{#SNMPINDEX}])=0 and last(/Sophos XGS SNMPv2 - CONTEGO/net.if.status[IPSecActive.{#SNMPINDEX}])=1'
              name: 'IPSec Status {#SFOS_CONN_NAME}: Desconectada'
              priority: HIGH
