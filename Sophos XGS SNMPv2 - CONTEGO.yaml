    -
      uuid: 9eb181575e5544ae8c352a555ad2778f
      template: 'Sophos XGS SNMPv2 - CONTEGO'
      name: 'Sophos XGS SNMPv2 - CONTEGO'
      description: |
        Template de monitoramento para Firewalls Sophos XG/XGS via SNMPv2, desenvolvido e customizado pela CONTEGO para monitoramento operacional e proativo do ambiente.
        
        Recursos monitorados:
        - Status geral do appliance
        - Informações de inventário (nome, modelo e serial)
        - Consumo de CPU e memória
        - Serviços internos do SFOS
        - Estado de serviços críticos:
          - Apache
          - AV
          - IPS
          - VPN
          - Reporting
          - Authentication
          - Network
          - DHCP
          - HA
          - Entre outros
        - Licenciamento e validade de subscriptions
        - Interfaces de rede
        - Sessões e desempenho
        - Alarmes e triggers para indisponibilidade de serviços
        
        Template compatível com Sophos Firewall OS (SFOS) utilizando a MIB oficial SOPHOS-SFOS-FIREWALL-MIB.
        
        Desenvolvido para utilização em ambientes monitorados pelo Zabbix com coleta SNMPv2 habilitada.
