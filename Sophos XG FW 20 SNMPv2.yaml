      discovery_rules:
        -
          uuid: de487f24cd904ddf832e150acc0b0038
          name: 'Vpn Interface Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SFOS_CONN_NAME}, 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.2, {#SFOS_CONN_DESC}, 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.3, {#SFOS_CONN_TYPE}, 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.6, {#SFOS_VPN_LOCAL_PORT}, 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.7, {#SFOS_VPN_CONN_STATUS}, 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9, {#SFOS_VPN_CONN_ACTIVE}, 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.10]'
          key: net.if.status
          filter:
            conditions:
              -
                macro: '{#SFOS_CONN_DESC}'
                value: '{$SFOS-F-MIB-CONN-DESC-NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              -
                macro: '{#SFOS_CONN_DESC}'
                value: '{$SFOS-F-MIB-CONN-DESC}'
                formulaid: B
              -
                macro: '{#SFOS_CONN_NAME}'
                value: '{$SFOS-F-MIB-CONN-NAME-NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
              -
                macro: '{#SFOS_CONN_NAME}'
                value: '{$SFOS-F-MIB-CONN-NAME}'
                formulaid: D
              -
                macro: '{#SFOS_CONN_TYPE}'
                value: '{$SFOS-F-MIB-CONN-DESC-NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: E
              -
                macro: '{#SFOS_CONN_TYPE}'
                value: '{$SFOS-F-MIB-CONN-DESC}'
                formulaid: F
              -
                macro: '{#SFOS_VPN_CONN_ACTIVE}'
                value: '{$SFOS-F-MIB-CONN-ACTIVE-NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: G
              -
                macro: '{#SFOS_VPN_CONN_ACTIVE}'
                value: '{$SFOS-F-MIB-CONN-ACTIVE}'
                formulaid: H
              -
                macro: '{#SFOS_VPN_CONN_STATUS}'
                value: '{$SFOS-F-MIB-CONN-STATUS-NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: I
              -
                macro: '{#SFOS_VPN_CONN_STATUS}'
                value: '{$SFOS-F-MIB-CONN-STATUS}'
                formulaid: J
              -
                macro: '{#SFOS_VPN_LOCAL_PORT}'
                value: '{$SFOS-F-MIB-LOCAL-PORT-NOT}'
                operator: NOT_MATCHES_REGEX
                formulaid: K
              -
                macro: '{#SFOS_VPN_LOCAL_PORT}'
                value: '{$SFOS-F-MIB-LOCAL-PORT}'
                formulaid: L
          item_prototypes:
            -
              uuid: d000124f41c44fc2ad15a85ad151a6f6
              name: 'IPSec {#SFOS_CONN_NAME}: Active'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.status[IPSecActive.{#SNMPINDEX}]'
              tags:
                -
                  tag: Application
                  value: 'IPSec {#SFOS_CONN_NAME}'
              trigger_prototypes:
                -
                  uuid: 72a463f04dec4ced817d295724794495
                  expression: |
                    last(/Sophos XG FW 20 SNMPv2/net.if.status[IPSecActive.{#SNMPINDEX}],#1) <> last(/Sophos XG FW 20 SNMPv2/net.if.status[IPSecActive.{#SNMPINDEX}],#2) and
                    last(/Sophos XG FW 20 SNMPv2/net.if.status[IPSecActive.{#SNMPINDEX}]) = 0
                  name: 'IPSec {#SFOS_CONN_NAME}: Desabilitada'
                  priority: HIGH
                  manual_close: 'YES'
            -
              uuid: d23eb48a560b49dea00111dc0895890f
              name: 'IPSec {#SFOS_CONN_NAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9.{#SNMPINDEX}'
              key: 'net.if.status[IPSecStatus.{#SNMPINDEX}]'
              tags:
                -
                  tag: Application
                  value: 'IPSec {#SFOS_CONN_NAME}'
          trigger_prototypes:
            -
              uuid: 80fb8c98843247cfa84192d34a5ec4f9
              expression: 'last(/Sophos XG FW 20 SNMPv2/net.if.status[IPSecStatus.{#SNMPINDEX}])= 0 and last(/Sophos XG FW 20 SNMPv2/net.if.status[IPSecActive.{#SNMPINDEX}]) = 1'
              name: 'IPSec Status {#SFOS_CONN_NAME}: Desconectada'
              priority: HIGH
              manual_close: 'YES'
