      expression: '(last(/Sophos XG FW 20 SNMPv2/haMode)=1 and last(/Sophos XG FW 20 SNMPv2/currentHAStatus)=2)'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/Sophos XG FW 20 SNMPv2/currentHAStatus)<>2 or last(/Sophos XG FW 20 SNMPv2/currentHAStatus)<>4'
